<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amul Ice Cream Selection (No Prices)</title>
    <style>
        body{font-family:sans-serif;margin:40px;}
        h2{color:#0b4d63;background:#e3f6fb;padding:10px;border-radius:5px;}
        section{margin-bottom:32px;}
        .product-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
        .item{padding:16px;border:1px solid #eee;border-radius:8px;background:#f7f9fa;display:flex;align-items:center;gap:8px;}
        .checkbox{width:20px;height:20px;}
        .quantity-input{width:50px;padding:4px;}
        .product-info{flex-grow:1;}
        .btn{margin:16px 0;background:#059;text-decoration:none;color:#fff;padding:14px 24px;border-radius:6px;font-weight:bold;font-size:18px;border:none;cursor:pointer;}

        /* Responsive styles */
        @media (max-width: 900px) {
            .product-list {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 600px) {
            body {
                margin: 8px;
                font-size: 16px;
            }
            h1 {
                font-size: 1.4em;
            }
            h2 {
                font-size: 1.1em;
                padding: 7px;
            }
            .product-list {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .item {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px;
                font-size: 1em;
            }
            .btn {
                width: 100%;
                font-size: 1em;
                padding: 12px 0;
            }
            .quantity-input {
                width: 100%;
                max-width: 80px;
            }
        }
    </style>
</head>
<body>
    <h1>Amul Ice Cream Full Range (2025)</h1>
    <p>Select products and <b>export selected items to WhatsApp</b>!</p>

    <form id="iceCreamForm">
        <div id="sections"></div>
        <button type="button" class="btn" onclick="exportToWhatsapp()">Export Selected to WhatsApp</button>
    </form>

        {"category":"Premium/Special","name":"Rasmalai","size":"Standard"},
        {"category":"Premium/Special","name":"Sandwitch","size":"Standard"}

    ];

    function renderSections(){
        const cats = [...new Set(iceCreamData.map(x=>x.category))];
        let html = '';
        cats.forEach(cat=>{
            html += `<section><h2>${cat}</h2><div class="product-list">`;
            iceCreamData.filter(x=>x.category===cat).forEach((item,idx)=>{
                html += `<div class="item">
                    <input type="checkbox" class="checkbox" id="ck_${cat}_${idx}" data-name="${item.name}" data-cat="${cat}" data-size="${item.size}">
                    <label class="product-info" for="ck_${cat}_${idx}">
                        <span><b>${item.name}</b></span><br>
                        <span>${item.size}</span>
                    </label>
                    <input type="number" class="quantity-input" id="qty_${cat}_${idx}" min="1" value="1" disabled title="Enter quantity" />
                </div>`;
            });
            html += '</div></section>';
        });
        document.getElementById('sections').innerHTML = html;

        // Enable quantity input when checkbox checked, disable otherwise
        document.querySelectorAll('.checkbox').forEach(chk=>{
            chk.addEventListener('change', event=>{
                const idx = event.target.id.replace('ck_','qty_');
                const qtyInput = document.getElementById(idx);
                if(event.target.checked){
                    qtyInput.disabled = false;
                    qtyInput.focus();
                } else {
                    qtyInput.disabled = true;
                    qtyInput.value = 1; // reset quantity if unchecked
                }
            });
        });
    }

    function exportToWhatsapp(){
        let message = `🍦 Amul Ice Cream Selection\n\n`;
        const cats = [...new Set(iceCreamData.map(x=>x.category))];
        let added = false;

        cats.forEach(cat=>{
            const selected = Array.from(document.querySelectorAll(`.checkbox[data-cat='${cat}']:checked`));
            if(selected.length>0){
                message += `⭐ ${cat}\n`;
                selected.forEach(e=>{
                    const idx = e.id.replace('ck_','qty_');
                    const qtyInput = document.getElementById(idx);
                    const quantity = qtyInput && qtyInput.value > 0 ? qtyInput.value : 1;
                    message += `• ${e.dataset.name} (${e.dataset.size}) × ${quantity}\n`;
                });
                message += `\n`;
                added = true;
            }
        });

        if(!added){
            alert("Please select at least one product!");
            return;
        }

        message += "📱 Amul Ice Cream oreder";
        let whatsappURL = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(whatsappURL,'_blank');
    }

    renderSections();
    </script>
</body>
